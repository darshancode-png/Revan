<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040c17" />
      <stop offset="50%" stop-color="#071426" />
      <stop offset="100%" stop-color="#091b33" />
    </linearGradient>

    <!-- Tech Rim Light Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0869E8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#529bff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="roseGlow" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- Suit & Shirt Gradients -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14243b" />
      <stop offset="50%" stop-color="#0c1624" />
      <stop offset="100%" stop-color="#060c14" />
    </linearGradient>

    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3657" />
      <stop offset="100%" stop-color="#0d1929" />
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97736" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="600" height="800" fill="url(#bgGrad)" />

  <!-- High-Tech Geometric Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="0" y1="600" x2="600" y2="600" />
    <line x1="0" y1="700" x2="600" y2="700" />
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
  </g>

  <!-- Atmospheric Aura Spotlight Behind Head -->
  <circle cx="300" cy="280" r="180" fill="#0869E8" opacity="0.25" filter="url(#glow)" />
  <circle cx="350" cy="300" r="140" fill="#ec4899" opacity="0.18" filter="url(#glow)" />

  <!-- Hexagonal Tech Nodes in Background -->
  <polygon points="300,90 320,102 320,126 300,138 280,126 280,102" fill="none" stroke="#0869E8" stroke-width="2" opacity="0.4" />
  <polygon points="120,240 135,249 135,267 120,276 105,267 105,249" fill="none" stroke="#529bff" stroke-width="1.5" opacity="0.3" />
  <polygon points="480,240 495,249 495,267 480,276 465,267 465,249" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.3" />

  <!-- Candidate Stylized Silhouette & Portrait -->
  <g id="candidateFigure">
    <!-- Back Rim Light on Shoulders -->
    <path d="M 80,800 C 90,620 160,540 230,510 L 270,510 L 330,510 L 370,510 C 440,540 510,620 520,800 Z" fill="#030810" />

    <!-- Suit Torso -->
    <path d="M 100,800 C 110,640 175,560 235,530 L 265,530 L 300,680 L 335,530 L 365,530 C 425,560 490,640 500,800 Z" fill="url(#suitGrad)" />

    <!-- Left Suit Lapel -->
    <path d="M 235,530 L 300,720 L 285,720 L 205,560 Z" fill="url(#lapelGrad)" stroke="#0869E8" stroke-width="1" stroke-opacity="0.3" />
    <!-- Right Suit Lapel -->
    <path d="M 365,530 L 300,720 L 315,720 L 395,560 Z" fill="url(#lapelGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3" />

    <!-- White Dress Shirt V-Neck -->
    <polygon points="265,530 300,640 335,530 315,480 285,480" fill="url(#shirtGrad)" />
    <!-- Modern Tech Navy Tie -->
    <polygon points="293,530 307,530 312,650 300,680 288,650" fill="#0869E8" />
    <polygon points="290,520 310,520 306,535 294,535" fill="#0650b3" />

    <!-- Neck -->
    <rect x="270" y="420" width="60" height="90" rx="8" fill="url(#skinGrad)" />
    <path d="M 270,470 L 300,500 L 330,470 Z" fill="#5c2609" opacity="0.4" />

    <!-- Head / Face Structure -->
    <!-- Jawline & Face -->
    <path d="M 230,300 C 230,420 260,460 300,460 C 340,460 370,420 370,300 C 370,220 350,190 300,190 C 250,190 230,220 230,300 Z" fill="url(#skinGrad)" />

    <!-- Left & Right Ears -->
    <path d="M 224,310 C 220,290 220,350 232,350 Z" fill="#b45309" />
    <path d="M 376,310 C 380,290 380,350 368,350 Z" fill="#9a3412" />

    <!-- Professional Hair Grooming -->
    <path d="M 226,290 C 220,210 245,150 300,150 C 360,150 380,200 375,280 C 365,240 350,210 300,210 C 260,210 240,240 226,290 Z" fill="url(#hairGrad)" />
    <path d="M 235,210 C 265,160 345,160 368,210 C 350,175 320,165 295,165 C 270,165 250,180 235,210 Z" fill="#27272a" />

    <!-- Eyebrows -->
    <path d="M 252,280 Q 272,274 286,282" stroke="#18181b" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 348,280 Q 328,274 314,282" stroke="#18181b" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Eyes (Focused, Confident) -->
    <ellipse cx="270" cy="298" rx="10" ry="5.5" fill="#ffffff" />
    <circle cx="271" cy="298" r="4.5" fill="#18181b" />
    <circle cx="272.5" cy="296.5" r="1.5" fill="#ffffff" />

    <ellipse cx="330" cy="298" rx="10" ry="5.5" fill="#ffffff" />
    <circle cx="329" cy="298" r="4.5" fill="#18181b" />
    <circle cx="330.5" cy="296.5" r="1.5" fill="#ffffff" />

    <!-- Nose Bridge & Tip -->
    <path d="M 298,285 L 296,335 Q 300,342 305,335" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Confident, Approachable Smile -->
    <path d="M 278,375 Q 300,392 322,375" stroke="#451a03" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 283,375 Q 300,385 317,375" fill="#ffffff" opacity="0.9" />

    <!-- Subtle Blue Tech Rim Light (Left Profile) -->
    <path d="M 228,290 C 228,380 250,440 280,455" stroke="#529bff" stroke-width="3.5" fill="none" opacity="0.75" />
    <path d="M 120,780 C 130,650 185,570 235,535" stroke="#529bff" stroke-width="2.5" fill="none" opacity="0.6" />

    <!-- Subtle Rose Rim Light (Right Profile) -->
    <path d="M 372,290 C 372,380 350,440 320,455" stroke="#ec4899" stroke-width="3.5" fill="none" opacity="0.65" />
    <path d="M 480,780 C 470,650 415,570 365,535" stroke="#ec4899" stroke-width="2.5" fill="none" opacity="0.5" />
  </g>

  <!-- Official Candidate Insignia / Lapel Pin -->
  <g transform="translate(230, 600)">
    <circle cx="0" cy="0" r="12" fill="#071426" stroke="#0869E8" stroke-width="2" />
    <polygon points="0,-7 6,-3 6,5 0,9 -6,5 -6,-3" fill="#0869E8" />
  </g>

  <!-- Bottom Cinematic Gradient Overlay -->
  <rect y="640" width="600" height="160" fill="url(#bgGrad)" opacity="0.7" />

  <!-- Stylized Monogram Badge in Upper Corner -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="80" height="30" rx="8" fill="#0869E8" fill-opacity="0.15" stroke="#0869E8" stroke-width="1.5" />
    <text x="40" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#529bff" text-anchor="middle" letter-spacing="2">CSE '26</text>
  </g>
</svg>
